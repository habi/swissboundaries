name: Swiss Municipality Boundary Comparison
on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:  # Run on pushes to main branch
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering
  
permissions:
  contents: write       # Needed to commit output and history folders
  id-token: write       # Required for GitHub Pages authentication
  pages: write          # Required to deploy to GitHub Pages
  actions: read         # Recommended for artifact access

jobs:
  compare-boundaries:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Resolve latest Swisstopo swissBOUNDARIES3D release
      run: |
        echo "Fetching latest swissBOUNDARIES3D release..."
        API="https://data.geo.admin.ch/api/stac/v0.9/collections/ch.swisstopo.swissboundaries3d/items"
        # Get the latest item (id + datetime in one call)
        LATEST=$(curl -s "$API" | jq -r '.features | max_by(.properties.datetime)')
        ITEM=$(echo "$LATEST" | jq -r '.id')
        ITEM_DATETIME=$(echo "$LATEST" | jq -r '.properties.datetime | split("T")[0]')
        URL=$(curl -s "$API/$ITEM" \
          | jq -r '.assets | to_entries[] | select(.value.href | test("2056.*gpkg.zip")) | .value.href' \
          | head -n1)
        echo "Latest item: $ITEM"
        echo "Item datetime: $ITEM_DATETIME"
        echo "Download URL: $URL"
        echo "SWISSTOPO_ITEM=$ITEM" >> $GITHUB_ENV
        echo "SWISSTOPO_DATE=$ITEM_DATETIME" >> $GITHUB_ENV
        echo "SWISSTOPO_URL=$URL" >> $GITHUB_ENV

    - name: Restore swissBOUNDARIES3D cache
      id: swisstopo-cache
      uses: actions/cache@v4
      with:
        path: .cache/swissboundaries3d
        key: swissboundaries3d-${{ runner.os }}-${{ env.SWISSTOPO_ITEM }}

    - name: Download or reuse cached swissBOUNDARIES3D file
      run: |
        mkdir -p .cache/swissboundaries3d

        if [ "${{ steps.swisstopo-cache.outputs.cache-hit }}" != "true" ]; then
          echo "Cache miss, downloading latest swissBOUNDARIES3D..."
          wget -q -O .cache/swissboundaries3d/swissboundaries3d_2056.gpkg.zip "$SWISSTOPO_URL"
          unzip -o -q .cache/swissboundaries3d/swissboundaries3d_2056.gpkg.zip -d .cache/swissboundaries3d
        else
          echo "Cache hit, reusing swissBOUNDARIES3D from cache"
        fi

        GPKG_PATH=$(find .cache/swissboundaries3d -maxdepth 1 -name '*.gpkg' | head -n1)
        if [ -z "$GPKG_PATH" ]; then
          echo "No .gpkg found in cache, forcing fresh download..."
          wget -q -O .cache/swissboundaries3d/swissboundaries3d_2056.gpkg.zip "$SWISSTOPO_URL"
          unzip -o -q .cache/swissboundaries3d/swissboundaries3d_2056.gpkg.zip -d .cache/swissboundaries3d
          GPKG_PATH=$(find .cache/swissboundaries3d -maxdepth 1 -name '*.gpkg' | head -n1)
        fi

        cp "$GPKG_PATH" swissBOUNDARIES3D_1_5_LV95_LN02.gpkg
        echo "Prepared GPKG: $GPKG_PATH"
        
    - name: Run boundary comparison
      run: |
        python compare_boundaries.py
        
    - name: Generate summary for GitHub
      run: |
        cat > $GITHUB_STEP_SUMMARY << 'EOF'
        # Swiss Municipality Boundary Comparison Report
                
        EOF
        cat output/comparison_report.md >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
    - name: Commit results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add output/ history/
        git diff --quiet && git diff --staged --quiet || git commit -m "Update boundary comparison results - $(date +'%Y-%m-%d')"
        git push
      continue-on-error: true
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: boundary-comparison-results
        path: |
          output/
          history/
          osm_boundaries.geojson
        retention-days: 90

    # Deploy Pages in the same job after committing
    - name: Setup Pages
      uses: actions/configure-pages@v4
      if: github.ref == 'refs/heads/main'
      
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: './output'
        
    - name: Deploy to GitHub Pages
      id: deployment
      if: github.ref == 'refs/heads/main'
      uses: actions/deploy-pages@v4
