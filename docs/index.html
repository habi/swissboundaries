<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>
    <h2>My CSV Data Table</h2>
    <div id="csv-table"></div>

    <script>
        // 1. Fetch the CSV file
        Papa.parse("reports/detailed_results.csv", {
            download: true,
            header: true,
            complete: function(results) {
                // 2. Initialize the table with the parsed data
                new Tabulator("#csv-table", {
                    data: results.data,
                    autoColumns: true, // Automatically creates columns based on CSV headers
                    pagination: "local",
                    paginationSize: 10,
                    layout: "fitColumns",
                });
            }
        });
    </script>
</body>
</html>
